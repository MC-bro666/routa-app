<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 智能菜谱推荐</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }
    .auth-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
      padding: 40px;
      width: 100%;
      max-width: 400px;
    }
    .auth-card h1 {
      text-align: center;
      font-size: 24px;
      color: #e74c3c;
      margin-bottom: 8px;
    }
    .auth-card .subtitle {
      text-align: center;
      font-size: 14px;
      color: #999;
      margin-bottom: 28px;
    }
    .auth-card .form-group {
      margin-bottom: 16px;
    }
    .auth-card label {
      display: block;
      font-size: 14px;
      color: #666;
      margin-bottom: 6px;
    }
    .auth-card input, .auth-card select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .auth-card input:focus, .auth-card select:focus {
      border-color: #e74c3c;
    }
    .auth-card .btn-primary {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
    }
    .auth-card .toggle-link {
      text-align: center;
      margin-top: 16px;
      font-size: 14px;
      color: #999;
    }
    .auth-card .toggle-link a {
      color: #e74c3c;
      cursor: pointer;
      text-decoration: none;
    }
    .auth-card .toggle-link a:hover {
      text-decoration: underline;
    }
    .auth-card .success-msg {
      text-align: center;
      color: #27ae60;
      font-size: 14px;
      margin-bottom: 16px;
    }
    .auth-card .error-msg {
      text-align: center;
      color: #e74c3c;
      font-size: 14px;
      margin-bottom: 16px;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <h1>🍽️ 智能菜谱推荐</h1>
      <p class="subtitle">登录后获取个性化菜谱推荐</p>

      <div id="successMessage" class="success-msg hidden"></div>
      <div id="errorMessage" class="error-msg hidden"></div>

      <form id="loginForm">
        <div class="form-group">
          <label>用户名</label>
          <input type="text" id="loginUsername" required placeholder="请输入用户名">
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" id="loginPassword" required placeholder="请输入密码">
        </div>
        <button type="submit" class="btn-primary">登录</button>
        <div class="toggle-link">
          还没有账号？<a id="showRegister">立即注册</a>
        </div>
      </form>

      <form id="registerForm" class="hidden">
        <div class="form-group">
          <label>用户名</label>
          <input type="text" id="regUsername" required placeholder="请输入用户名">
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" id="regPassword" required placeholder="请输入密码（至少6位）">
        </div>
        <div class="form-group">
          <label>年龄</label>
          <input type="number" id="regAge" required placeholder="请输入年龄" min="1" max="150">
        </div>
        <div class="form-group">
          <label>性别</label>
          <select id="regGender" required>
            <option value="">请选择性别</option>
            <option value="male">男</option>
            <option value="female">女</option>
          </select>
        </div>
        <div class="form-group">
          <label>身高（厘米）</label>
          <input type="number" id="regHeight" required placeholder="请输入身高" min="50" max="250">
        </div>
        <div class="form-group">
          <label>体重（公斤）</label>
          <input type="number" id="regWeight" required placeholder="请输入体重" min="20" max="300">
        </div>
        <div class="form-group">
          <label>活动水平</label>
          <select id="regActivity" required>
            <option value="">请选择活动水平</option>
            <option value="low">久坐不动</option>
            <option value="medium">轻度活动</option>
            <option value="high">积极活动</option>
          </select>
        </div>
        <button type="submit" class="btn-primary">注册</button>
        <div class="toggle-link">
          已有账号？<a id="showLogin">返回登录</a>
        </div>
      </form>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:3001/api';

    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const showRegister = document.getElementById('showRegister');
    const showLogin = document.getElementById('showLogin');
    const successMsg = document.getElementById('successMessage');
    const errorMsg = document.getElementById('errorMessage');

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.classList.remove('hidden');
      successMsg.classList.add('hidden');
    }

    function showSuccess(msg) {
      successMsg.textContent = msg;
      successMsg.classList.remove('hidden');
      errorMsg.classList.add('hidden');
    }

    function hideMessages() {
      errorMsg.classList.add('hidden');
      successMsg.classList.add('hidden');
    }

    showRegister.addEventListener('click', function(e) {
      e.preventDefault();
      loginForm.classList.add('hidden');
      registerForm.classList.remove('hidden');
      hideMessages();
    });

    showLogin.addEventListener('click', function(e) {
      e.preventDefault();
      registerForm.classList.add('hidden');
      loginForm.classList.remove('hidden');
      hideMessages();
    });

    loginForm.addEventListener('submit', async function(e) {
      e.preventDefault();
      hideMessages();

      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;

      try {
        const res = await fetch(API_BASE + '/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (!res.ok) {
          showError(data.error || '登录失败，请检查用户名和密码');
          return;
        }

        localStorage.setItem('token', data.token);
        localStorage.setItem('userId', String(data.userId || data.user_id));
        localStorage.setItem('username', data.username || username);
        window.location.href = 'index.html';
      } catch (err) {
        showError('网络错误，请稍后重试');
      }
    });

    registerForm.addEventListener('submit', async function(e) {
      e.preventDefault();
      hideMessages();

      const username = document.getElementById('regUsername').value.trim();
      const password = document.getElementById('regPassword').value;
      const age = parseInt(document.getElementById('regAge').value);
      const gender = document.getElementById('regGender').value;
      const height = parseFloat(document.getElementById('regHeight').value);
      const weight = parseFloat(document.getElementById('regWeight').value);
      const activityLevel = document.getElementById('regActivity').value;

      if (password.length < 6) {
        showError('密码至少需要6位');
        return;
      }

      try {
        const res = await fetch(API_BASE + '/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username, password, age, gender, height, weight, activity_level: activityLevel
          })
        });

        const data = await res.json();

        if (!res.ok) {
          showError(data.error || '注册失败');
          return;
        }

        showSuccess('注册成功！请登录');
        registerForm.classList.add('hidden');
        loginForm.classList.remove('hidden');
        document.getElementById('loginUsername').value = username;
        document.getElementById('loginPassword').value = '';
      } catch (err) {
        showError('网络错误，请稍后重试');
      }
    });
  </script>
</body>
</html>
